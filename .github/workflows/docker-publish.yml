name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]   # so the required `build-and-push` ruleset check actually runs on PRs
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # owner/repo — metadata-action lowercases it

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        id: buildx

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags + labels)
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=OSRS Quest Pathfinder
            org.opencontainers.image.description=OSRS prerequisite planner — quest chains, skill gates, XP and playtime estimates
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}   # explicit: never fall back to the default docker driver
          context: .
          # PR runs (ruleset check) build only; actual pushes happen on main/tags
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # footer build identity: short SHA, matches the sha-xxxxxxx image tag
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ github.sha }}
          # inline cache rides inside the pushed image — the only export backend
          # supported by EVERY buildx driver. type=gha broke when the runner
          # fell back to the plain docker driver ("Cache export is not
          # supported for the docker driver"); inline can't hit that.
          cache-from: type=inline
          cache-to: type=inline
