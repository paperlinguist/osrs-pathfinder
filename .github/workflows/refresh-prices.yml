name: Refresh GE price snapshot

# Monthly + on demand: re-fetches the GE prices baked into gear.json so the
# live-price fallback doesn't rot between manual builds. Opens a PR only when
# prices actually changed.
on:
  schedule:
    - cron: "17 7 1 * *" # 07:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh prices
        run: node tools/refresh-prices.ts

      - name: Open PR if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet src/data/gear.json; then
            echo "No price changes this run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="price-refresh/$(date -u +%Y-%m-%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add src/data/gear.json
          git commit -m "chore: refresh GE price snapshot"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: refresh GE price snapshot" \
            --body "Automated monthly refresh of the GE price snapshot in \`gear.json\` — the fallback used when live prices can't be fetched. Merging re-deploys the app with a fresher snapshot."
