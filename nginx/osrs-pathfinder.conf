# ============================================================================
# OSRS Quest Pathfinder — nginx reverse proxy
# Domain: osrs-pathfinder.abifin.org (Cloudflare → this server)
#
# Install:  sudo cp osrs-pathfinder.conf /etc/nginx/sites-available/
#           sudo ln -s /etc/nginx/sites-available/osrs-pathfinder.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

# --- HTTP :80 ---------------------------------------------------------------
# Works out of the box with Cloudflare SSL mode "Flexible" (edge HTTPS -> origin HTTP).
server {
    listen 80;
    listen [::]:80;
    server_name osrs-pathfinder.abifin.org;

    # Cloudflare real-IP restoration (uncomment if you want accurate visitor IPs
    # in logs; ranges from https://www.cloudflare.com/ips/)
    #set_real_ip_from 173.245.48.0/20;
    #set_real_ip_from 103.21.244.0/22;
    #set_real_ip_from 103.22.200.0/22;
    #set_real_ip_from 103.31.4.0/22;
    #set_real_ip_from 141.101.64.0/18;
    #set_real_ip_from 108.162.192.0/18;
    #set_real_ip_from 190.93.240.0/20;
    #set_real_ip_from 188.114.96.0/20;
    #set_real_ip_from 197.234.240.0/22;
    #set_real_ip_from 198.41.128.0/17;
    #set_real_ip_from 162.158.0.0/15;
    #set_real_ip_from 104.16.0.0/13;
    #set_real_ip_from 104.24.0.0/14;
    #set_real_ip_from 172.64.0.0/13;
    #set_real_ip_from 131.0.72.0/22;
    #real_ip_header CF-Connecting-IP;

    # Gzip for JS/CSS/JSON payloads
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3001;   # docker-compose maps 127.0.0.1:3001 -> container:3000

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;   # Cloudflare sets this
        proxy_set_header Accept-Encoding "";

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_buffering off;                # stream API responses without delay
    }
}

